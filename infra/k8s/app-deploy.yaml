apiVersion: apps/v1
kind: Deployment
metadata:
  name: darwin-app
  labels:
    app: darwin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: darwin
  template:
    metadata:
      labels:
        app: darwin
    spec:
      containers:
        - name: app
          image: darwin/app:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: darwin-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: darwin-app
spec:
  selector:
    app: darwin
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
