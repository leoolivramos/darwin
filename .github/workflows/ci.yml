name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B clean package -DskipTests
        working-directory: app

  build-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: detector, entry: detector.py }
          - { service: generator, entry: generator.py }
          - { service: evaluator, entry: evaluator.py }
          - { service: orchestrator, entry: orchestrator.py }
          - { service: sandbox-runner, entry: sandbox_runner.py }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
        working-directory: ${{ matrix.service }}
      - run: python -m py_compile ${{ matrix.entry }}
        working-directory: ${{ matrix.service }}

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >
          pip install pytest pytest-cov httpx fakeredis
          -r orchestrator/requirements.txt
          -r generator/requirements.txt
          -r evaluator/requirements.txt
          -r detector/requirements.txt
          -r sandbox-runner/requirements.txt
      - run: pytest tests/unit -v --cov

  test-integration:
    runs-on: ubuntu-latest
    needs: [build-app, build-services, test-unit]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 900
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/integration/smoke_test.py
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
