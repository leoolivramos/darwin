services:

  app:
    build: ./app
    container_name: codigo-vivo-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=prometheus,health,info
      - SPRING_PROFILES_ACTIVE=local
    networks:
      - codigo-vivo-net
    depends_on:
      - prometheus
      - minio

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: codigo-vivo-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - codigo-vivo-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: codigo-vivo-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - codigo-vivo-net
    volumes:
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: codigo-vivo-jaeger
    ports:
      - "${JAEGER_PORT:-16686}:16686"
      - "6831:6831/udp"
      - "6832:6832/udp"
    networks:
      - codigo-vivo-net

  minio:
    build: ./infra/minio
    container_name: codigo-vivo-minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - codigo-vivo-net

  redis:
    image: redis:7-alpine
    container_name: codigo-vivo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - codigo-vivo-net

  postgres:
    image: postgres:16-alpine
    container_name: codigo-vivo-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-darwin}
      - POSTGRES_USER=${POSTGRES_USER:-darwin_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-darwin_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darwin_user} -d ${POSTGRES_DB:-darwin}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - codigo-vivo-net

  detector:
    build: ./detector
    container_name: codigo-vivo-detector
    ports:
      - "5004:5004"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - ORCHESTRATOR_URL=http://orchestrator:5003
      - REDIS_URL=redis://redis:6379/0
      - CHECK_INTERVAL=30
    networks:
      - codigo-vivo-net
    depends_on:
      - prometheus
      - redis

  evaluator:
    build: ./evaluator
    container_name: codigo-vivo-evaluator
    ports:
      - "5001:5001"
    networks:
      - codigo-vivo-net

  generator:
    build: ./generator
    container_name: codigo-vivo-generator
    ports:
      - "5002:5002"
    environment:
      - REPO_PATH=/repo
      - APP_SOURCE_PATH=/app-src
      - DETECTOR_URL=http://detector:5004
      - EVALUATOR_URL=http://evaluator:5001
      - ORCHESTRATOR_URL=http://orchestrator:5003
      - LOG_LEVEL=INFO
    volumes:
      - ./repo:/repo
      - ./app:/app-src:ro
    networks:
      - codigo-vivo-net
    depends_on:
      - prometheus
      - minio

  orchestrator:
    build: ./orchestrator
    container_name: codigo-vivo-orchestrator
    ports:
      - "5003:5003"
    environment: &orchestrator-env
      - REDIS_URL=redis://redis:6379/0
      - GENERATOR_URL=http://generator:5002
      - EVALUATOR_URL=http://evaluator:5001
      - SANDBOX_URL=http://sandbox-runner:9091
      - PROMETHEUS_URL=http://prometheus:9090
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-darwin}
      - POSTGRES_USER=${POSTGRES_USER:-darwin_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-darwin_pass}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AUTO_PROMOTE=${AUTO_PROMOTE:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      generator:
        condition: service_started
      evaluator:
        condition: service_started
    networks:
      - codigo-vivo-net

  orchestrator-worker:
    build: ./orchestrator
    container_name: codigo-vivo-orchestrator-worker
    command: celery -A worker worker --loglevel=info
    environment: *orchestrator-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    networks:
      - codigo-vivo-net

  sandbox-runner:
    build: ./sandbox-runner
    container_name: codigo-vivo-sandbox-runner
    ports:
      - "9091:9091"
    environment:
      - REPO_PATH=/repo
      - SANDBOX_DEFAULT_ENDPOINTS=/hello,/slow
    volumes:
      - ./repo:/repo:ro
      - maven_cache:/root/.m2
    networks:
      - codigo-vivo-net

  telemetry-agent:
    build: ./telemetry-agent
    container_name: codigo-vivo-telemetry-agent
    environment:
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - LOKI_ENDPOINT=http://loki:3100
      - PROMETHEUS_ENDPOINT=http://prometheus:9090
      - LOG_LEVEL=INFO
    networks:
      - codigo-vivo-net
    depends_on:
      - jaeger
      - loki

  loki:
    image: grafana/loki:3.1.0
    container_name: codigo-vivo-loki
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - codigo-vivo-net

networks:
  codigo-vivo-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  minio_data:
  redis_data:
  postgres_data:
  maven_cache:
