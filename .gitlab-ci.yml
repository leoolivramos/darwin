stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

build:app:
  stage: build
  image: maven:3.8-openjdk-17
  script:
    - cd app
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - app/target/
    expire_in: 1 week

build:detector:
  stage: build
  image: python:3.10
  script:
    - cd detector
    - pip install -r requirements.txt
    - python -m py_compile detector.py
  artifacts:
    paths:
      - detector/
    expire_in: 1 week

build:generator:
  stage: build
  image: python:3.10
  script:
    - cd generator
    - pip install -r requirements.txt
    - python -m py_compile generator.py
  artifacts:
    paths:
      - generator/
    expire_in: 1 week

build:evaluator:
  stage: build
  image: python:3.10
  script:
    - cd evaluator
    - pip install -r requirements.txt
    - python -m py_compile evaluator.py
  artifacts:
    paths:
      - evaluator/
    expire_in: 1 week

build:orchestrator:
  stage: build
  image: python:3.10
  script:
    - cd orchestrator
    - pip install -r requirements.txt
    - python -m py_compile orchestrator.py
  artifacts:
    paths:
      - orchestrator/
    expire_in: 1 week

test:unit:
  stage: test
  image: python:3.10
  script:
    - pip install pytest pytest-cov httpx fakeredis -r orchestrator/requirements.txt -r generator/requirements.txt -r evaluator/requirements.txt -r detector/requirements.txt -r sandbox-runner/requirements.txt
    - pytest tests/unit -v --cov
  coverage: '/TOTAL.*\s+(\d+%)$/'
  allow_failure: false

test:integration:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  script:
    - apk add --no-cache python3
    - docker-compose -f docker-compose.yml up -d --build --wait
    - python3 tests/integration/smoke_test.py
    - docker-compose down -v
  allow_failure: false

deploy:review:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker-compose -f docker-compose.yml up -d --build
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: http://localhost:8080
  only:
    - merge_requests

deploy:production:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $DOCKER_USER -p $DOCKER_PASSWORD $DOCKER_REGISTRY
    - docker-compose -f docker-compose.yml build
    - docker-compose -f docker-compose.yml push
  environment:
    name: production
    url: https://codigo-vivo.example.com
  only:
    - main
  when: manual
